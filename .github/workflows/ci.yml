name: CI
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q -p no:cacheprovider
  build:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, gitleaks]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . pyinstaller
      - run: ./build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
  exe-smoke:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Smoke test executable without Python
        shell: pwsh
        run: |
          $env:PATH = ($env:PATH -split ';' | Where-Object {
            $directory = $_.Trim().Trim('"')
            if (-not $directory -or $directory -match '(?i)WindowsApps|hostedtoolcache') { return $false }
            foreach ($name in @('python.exe', 'python3.exe', 'py.exe')) {
              if (Test-Path -LiteralPath (Join-Path $directory $name) -PathType Leaf) { return $false }
            }
            return $true
          }) -join ';'
          $pythonCommands = @(Get-Command python,python3,py -ErrorAction SilentlyContinue)
          if ($pythonCommands.Count -gt 0) {
            throw "Python commands are still available: $($pythonCommands | Out-String)"
          }

          $env:SCRAPPY_HOME = Join-Path $env:RUNNER_TEMP 'home'
          $env:SCRAPPY_PORT = '5099'
          $env:SCRAPPY_NO_BROWSER = '1'
          $exe = Join-Path $PWD 'dist/Scrappy.exe'
          if (-not (Test-Path $exe)) { throw "Executable not found: $exe" }

          $doctor = & $exe --doctor | ConvertFrom-Json
          if (-not $doctor.version) { throw 'Doctor JSON has no version' }

          $process = Start-Process -FilePath $exe -PassThru -WindowStyle Hidden
          $base = 'http://127.0.0.1:5099'
          $healthy = $false
          for ($i = 0; $i -lt 60; $i++) {
            try {
              $health = Invoke-RestMethod -Uri "$base/health" -TimeoutSec 2
              if ($health.app -eq 'scrappy') { $healthy = $true; break }
            } catch {}
            Start-Sleep -Seconds 1
          }
          if (-not $healthy) { throw 'Scrappy health endpoint did not become ready within 60 seconds' }

          foreach ($route in @('/favorites', '/kanban', '/listings', '/run_meta', '/api/ai')) {
            $response = Invoke-WebRequest -Uri "$base$route" -TimeoutSec 10
            if ([int]$response.StatusCode -ne 200) { throw "$route returned $($response.StatusCode)" }
          }

          try {
            Invoke-WebRequest -Uri "$base/api/quit" -Method Post -Headers @{ Origin = 'https://evil.example' } -TimeoutSec 10
            throw 'Foreign Origin quit request was not rejected'
          } catch {
            if ($_.Exception.Response -and [int]$_.Exception.Response.StatusCode -eq 403) { }
            elseif ($_.Exception.Message -eq 'Foreign Origin quit request was not rejected') { throw }
            else { throw "Foreign Origin quit request did not return 403: $_" }
          }

          $quit = Invoke-WebRequest -Uri "$base/api/quit" -Method Post -TimeoutSec 10
          if ([int]$quit.StatusCode -ne 200) { throw "Normal quit returned $($quit.StatusCode)" }
          $exited = $false
          for ($i = 0; $i -lt 15; $i++) {
            if (-not (Get-Process -Name Scrappy -ErrorAction SilentlyContinue)) { $exited = $true; break }
            Start-Sleep -Seconds 1
          }
          if (-not $exited) { throw 'Scrappy process remained after quit for 15 seconds' }
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, exe-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Install gitleaks
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz | tar -xz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
      - run: gitleaks detect --no-git --source dist --exit-code 1
      - run: cd dist && sha256sum Scrappy.exe > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Scrappy.exe
            dist/SHA256SUMS.txt
